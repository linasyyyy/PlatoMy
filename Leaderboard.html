<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlatoMy Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090d;
      --pink-main: #F996B1;
      --pink-bright: #ffb3c8;
      --pink-glow: rgba(249, 150, 177, 0.45);
      --white: #FFFFFF;
      --glass-bg: rgba(20, 20, 28, 0.55);
      --glass-border: rgba(249, 150, 177, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }

    .leaderboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
      background: radial-gradient(circle at 15% 15%, rgba(249, 150, 177, 0.16), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(249, 150, 177, 0.14), transparent 45%),
                  linear-gradient(160deg, #12121a 0%, #09090d 100%);
      border-radius: 20px;
      padding: 16px 18px;
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(249, 150, 177, 0.12),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 160px;
      height: 160px;
      background: rgba(249, 150, 177, 0.25);
      top: -45px;
      right: -35px;
    }
    .orb-2 {
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.08);
      bottom: -35px;
      left: -35px;
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 10px;
    }

    .badge-top {
      display: inline-block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--pink-main);
      background: rgba(249, 150, 177, 0.1);
      border: 1px solid rgba(249, 150, 177, 0.35);
      padding: 2px 10px;
      border-radius: 50px;
      margin-bottom: 4px;
      box-shadow: 0 0 12px rgba(249, 150, 177, 0.2);
    }

    .header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #FFFFFF 0%, #F996B1 55%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .header p {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(249, 150, 177, 0.5), transparent);
      margin: 8px 0 10px;
    }

    .player-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 34px 32px 1.25fr 1.45fr 66px;
      align-items: center;
      gap: 8px;
      background: var(--glass-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 4px 10px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .player-row:hover {
      transform: translateY(-1px);
      border-color: rgba(249, 150, 177, 0.45);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .player-row.rank-1 {
      background: linear-gradient(90deg, rgba(249, 150, 177, 0.18) 0%, rgba(20, 20, 28, 0.75) 60%);
      border: 1.2px solid var(--pink-main);
      box-shadow: 0 0 16px rgba(249, 150, 177, 0.2), inset 0 0 10px rgba(249, 150, 177, 0.08);
    }

    .player-row.rank-2,
    .player-row.rank-3 {
      border: 1px solid rgba(249, 150, 177, 0.35);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(20, 20, 28, 0.65) 60%);
    }

    .rank-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
    }
    .rank-1 .rank-num {
      font-size: 15px;
      color: var(--pink-main);
      text-shadow: 0 0 10px var(--pink-glow);
    }
    .rank-2 .rank-num,
    .rank-3 .rank-num {
      color: var(--white);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    }

    .avatar-box {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 1.5px;
      background: linear-gradient(135deg, var(--white), var(--pink-main));
      box-shadow: 0 0 8px rgba(249, 150, 177, 0.3);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #181822;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 10px;
      color: var(--white);
      overflow: hidden;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .crown {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      filter: drop-shadow(0 0 4px var(--pink-main));
    }

    .player-info {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      overflow: hidden;
    }

    .player-name {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--pink-main);
      letter-spacing: 0.4px;
    }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: 'Rajdhani', sans-serif;
      font-size: 9.5px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.65);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, #f996b1 0%, #ffd1df 100%);
      box-shadow: 0 0 8px var(--pink-glow);
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: translateX(-100%);
      animation: liquidShine 3.2s infinite ease-in-out;
    }

    @keyframes liquidShine {
      0%, 60% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .level-badge {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-align: center;
      padding: 3px 6px;
      border-radius: 7px;
      background: rgba(249, 150, 177, 0.12);
      border: 1px solid rgba(249, 150, 177, 0.4);
      color: var(--white);
      box-shadow: inset 0 0 6px rgba(249, 150, 177, 0.15);
    }

    .level-badge span {
      color: var(--pink-main);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.8px;
    }

    .footer strong {
      color: var(--pink-main);
    }

    @media (max-width: 520px) {
      .leaderboard-wrapper {
        padding: 14px 12px;
      }
      .player-row {
        grid-template-columns: 28px 28px 1fr 58px;
        padding: 4px 8px;
        gap: 6px;
      }
      .progress-wrap {
        display: none;
      }
      .header h1 {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <div class="leaderboard-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="header">
      <div class="badge-top">✦ PLATOMY ✦</div>
      <h1>MONTHLY LEADERBOARD</h1>
      <p>Top 10 Community EXP Rankings</p>
      <div class="divider"></div>
    </div>

    <div class="player-list" id="playerList"></div>

    <div class="footer">
      <span>AUTO-UPDATE SETIAP 10 MINIT</span>
      <span>POWERED BY <strong>PLATOMY</strong></span>
    </div>
  </div>

  <script>
    const players = {{PLAYERS_DATA}};

    const listEl = document.getElementById("playerList");
    listEl.innerHTML = players.slice(0, 10).map((p, index) => {
      const rank = p.rank || index + 1;
      const rankClass = rank <= 3 ? `rank-${rank}` : "";
      const isFirst = p.crown !== undefined ? p.crown : rank === 1;
      const avatarContent = p.avatar
        ? `<img src="${p.avatar}" alt="${p.name}">`
        : (p.initials || p.name.slice(0, 2).toUpperCase());

      return `
        <div class="player-row ${rankClass}">
          <div class="rank-num">#${rank}</div>
          <div class="avatar-box">
            ${isFirst ? '<span class="crown">👑</span>' : ''}
            <div class="avatar-inner">${avatarContent}</div>
          </div>
          <div class="player-info">
            <div class="player-name">${p.name}</div>
            <div class="player-sub">${p.exp} EXP</div>
          </div>
          <div class="progress-wrap">
            <div class="progress-meta"><span>XP Progress</span><span>${p.xp}%</span></div>
            <div class="progress-track"><div class="progress-fill" style="width: ${p.xp}%;"></div></div>
          </div>
          <div class="level-badge"><span>LVL</span> ${String(p.level).padStart(2, '0')}</div>
        </div>
      `;
    }).join("");
  </script>

</body>
</html>
