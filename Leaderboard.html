<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlatoMy Leaderboard</title>
  <!-- Google Fonts: Cinzel Decorative, Montserrat, Plus Jakarta Sans & Rajdhani -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090d;
      --pink-main: #F996B1;
      --pink-bright: #ffb3c8;
      --pink-glow: rgba(249, 150, 177, 0.45);
      --white: #FFFFFF;
      --glass-bg: rgba(20, 20, 28, 0.55);
      --glass-border: rgba(249, 150, 177, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Main Leaderboard Card with Ambient Glow */
    .leaderboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: radial-gradient(circle at 15% 15%, rgba(249, 150, 177, 0.16), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(249, 150, 177, 0.14), transparent 45%),
                  linear-gradient(160deg, #12121a 0%, #09090d 100%);
      border-radius: 20px;
      padding: 18px 20px;
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(249, 150, 177, 0.12),
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    /* Blurred Ambient Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 220px;
      height: 220px;
      background: rgba(249, 150, 177, 0.25);
      top: -60px;
      right: -50px;
    }
    .orb-2 {
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.08);
      bottom: -40px;
      left: -40px;
    }

    /* Header Section */
    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 12px;
    }

    .badge-top {
      display: inline-block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--pink-main);
      background: rgba(249, 150, 177, 0.1);
      border: 1px solid rgba(249, 150, 177, 0.35);
      padding: 3px 10px;
      border-radius: 50px;
      margin-bottom: 5px;
      box-shadow: 0 0 15px rgba(249, 150, 177, 0.2);
    }

    .header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #FFFFFF 0%, #F996B1 55%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .header p {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(249, 150, 177, 0.5), transparent);
      margin: 10px 0 12px;
    }

    /* Player List */
    .player-list {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 36px 32px 1.2fr 1.5fr 72px;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 11px;
      padding: 4px 12px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .player-row:hover {
      transform: translateY(-2px);
      border-color: rgba(249, 150, 177, 0.45);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    /* Special Highlights for Top 3 */
    .player-row.rank-1 {
      background: linear-gradient(90deg, rgba(249, 150, 177, 0.18) 0%, rgba(20, 20, 28, 0.75) 60%);
      border: 1.5px solid var(--pink-main);
      box-shadow: 0 0 25px rgba(249, 150, 177, 0.22), inset 0 0 15px rgba(249, 150, 177, 0.08);
    }

    .player-row.rank-2,
    .player-row.rank-3 {
      border: 1px solid rgba(249, 150, 177, 0.35);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(20, 20, 28, 0.65) 60%);
    }

    /* Rank Number */
    .rank-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
    }
    .rank-1 .rank-num {
      font-size: 16px;
      color: var(--pink-main);
      text-shadow: 0 0 14px var(--pink-glow);
    }
    .rank-2 .rank-num,
    .rank-3 .rank-num {
      color: var(--white);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
    }

    /* Crystal Frame Avatar */
    .avatar-box {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      padding: 1.5px;
      background: linear-gradient(135deg, var(--white), var(--pink-main));
      box-shadow: 0 0 10px rgba(249, 150, 177, 0.35);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #181822;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
      color: var(--white);
      overflow: hidden;
    }

    .crown {
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      filter: drop-shadow(0 0 6px var(--pink-main));
    }

    /* Player Name & Stats */
    .player-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--pink-main);
      letter-spacing: 0.5px;
    }

    /* Liquid Pink Progress Bar */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.65);
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 50px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, #f996b1 0%, #ffd1df 100%);
      box-shadow: 0 0 12px var(--pink-glow);
      position: relative;
      overflow: hidden;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: translateX(-100%);
      animation: liquidShine 3.2s infinite ease-in-out;
    }

    @keyframes liquidShine {
      0%, 60% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Level Badge */
    .level-badge {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(249, 150, 177, 0.12);
      border: 1px solid rgba(249, 150, 177, 0.4);
      color: var(--white);
      box-shadow: inset 0 0 8px rgba(249, 150, 177, 0.15);
    }

    .level-badge span {
      color: var(--pink-main);
    }

    /* Footer */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
    }

    .footer strong {
      color: var(--pink-main);
    }

    @media (max-width: 540px) {
      .leaderboard-wrapper {
        padding: 14px 12px;
      }
      .player-row {
        grid-template-columns: 30px 28px 1fr 64px;
        padding: 4px 8px;
        gap: 6px;
      }
      .progress-wrap {
        display: none;
      }
      .header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="leaderboard-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="header">
      <div class="badge-top">✦ PLATOMY ✦</div>
      <h1>MONTHLY LEADERBOARD</h1>
      <p>Top 10 Community Rankings</p>
      <div class="divider"></div>
    </div>

    <div class="player-list" id="playerList"></div>

    <div class="footer">
      <span>AUTO-UPDATE SETIAP 10 MINIT</span>
      <span>POWERED BY <strong>PLATOMY</strong></span>
    </div>
  </div>

  <script>
    // Leaderboard data for the Top 10 community members (EXP-based)
    const players = [
      { rank: 1, initials: "IL", name: "Ilz", exp: "48,250", xp: 92, level: "25", crown: true },
      { rank: 2, initials: "IS", name: "ishtf", exp: "41,400", xp: 84, level: "23" },
      { rank: 3, initials: "OL", name: "Olgath", exp: "35,920", xp: 75, level: "17" },
      { rank: 4, initials: "YY", name: "YYY", exp: "31,340", xp: 60, level: "16" },
      { rank: 5, initials: "RI", name: "richi", exp: "26,680", xp: 45, level: "09" },
      { rank: 6, initials: "KA", name: "Kairo", exp: "22,950", xp: 78, level: "08" },
      { rank: 7, initials: "ZY", name: "Zynx", exp: "19,410", xp: 64, level: "08" },
      { rank: 8, initials: "MI", name: "Mika", exp: "16,120", xp: 52, level: "07" },
      { rank: 9, initials: "AR", name: "Arel", exp: "13,890", xp: 39, level: "06" },
      { rank: 10, initials: "NO", name: "Nora", exp: "11,430", xp: 28, level: "05" }
    ];

    // Render rows cleanly into the DOM
    function renderLeaderboard() {
      const listEl = document.getElementById("playerList");
      listEl.innerHTML = players.map(p => {
        const rankClass = p.rank <= 3 ? `rank-${p.rank}` : "";
        return `
          <div class="player-row ${rankClass}">
            <div class="rank-num">#${p.rank}</div>
            <div class="avatar-box">
              ${p.crown ? '<span class="crown">👑</span>' : ''}
              <div class="avatar-inner">${p.initials}</div>
            </div>
            <div class="player-info">
              <div class="player-name">${p.name}</div>
              <div class="player-sub">${p.exp} EXP</div>
            </div>
            <div class="progress-wrap">
              <div class="progress-meta"><span>XP Progress</span><span>${p.xp}%</span></div>
              <div class="progress-track"><div class="progress-fill" style="width: ${p.xp}%;"></div></div>
            </div>
            <div class="level-badge"><span>LVL</span> ${p.level}</div>
          </div>
        `;
      }).join("");
    }

    renderLeaderboard();
  </script>

</body>
</html>
